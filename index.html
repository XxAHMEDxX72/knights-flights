<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knights Flights - البوابة الرئيسية</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            direction: rtl;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--accent);
            font-size: 2.2rem;
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .grid-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .card-link {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: bold;
            font-size: 1.1rem;
            transition: 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .card-link:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
            background: #253348;
        }

        .card-link span {
            font-size: 2rem;
        }

        .full-width {
            grid-column: span 2;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 نظام Knights Flights</h1>
    <p>اختر البوابة التي تريد الانتقال إليها:</p>

    <div class="grid-links">
        <a href="owner.html" class="card-link">
            <span>👑</span>
            لوحة المالك (Owner)
        </a>
        <a href="admin.html" class="card-link">
            <span>🏢</span>
            لوحة تحكم الشركة (Admin)
        </a>
        <a href="driver.html" class="card-link">
            <span>🚛</span>
            بوابة السائقين (Driver)
        </a>
        <a href="receiver.html" class="card-link">
            <span>📦</span>
            تتبع الشحنات (Receiver)
        </a>
    </div>
</div>

</body>
</html>
